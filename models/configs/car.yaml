# 车辆检测超参。对照港科大 config/car_training_config.yaml。
# 和上游的差别：骨干 YOLO26s；imgsz 由 stages.py 设成 1280（他们 yaml 误写成 192）。
# 增强偏猛（hsv / mosaic / mixup / copy_paste）：雷达图光照差、遮挡多。

# ----- 优化器 -----
lr0: 0.01                 # 初始学习率（SGD 量级；optimizer=auto 时 Ultralytics 会按优化器缩放）
lrf: 0.01                 # 最终 lr = lr0 * lrf
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1

# ----- 损失：车辆只有 1 类，把 box 权重大于 cls -----
box: 9.0                  # 定位权重大，雷达后续要靠框中心做射线投影
cls: 1.2
dfl: 0.9                  # Distribution Focal Loss，框边界回归
label_smoothing: 0.005
nbs: 64                   # 名义 batch，用来按实际 batch 缩放 weight_decay / lr

# ----- 增强：港科大车辆 cfg 比装甲板更激进 -----
hsv_h: 0.1                # 色相扰动大：直播录像白平衡乱
hsv_s: 0.4
hsv_v: 0.5                # 明暗：场馆灯 / 过曝
degrees: 0.0              # 雷达相机基本水平固定，不转大角
translate: 0.1
scale: 0.5                # 原注释想魔改到 0.1~1.5；官方接口只能给 gain
shear: 0.001
perspective: 0.0001
flipud: 0.1               # 雷达俯视，上下翻有一点合理性
fliplr: 0.2               # 单类 robot，左右翻安全；别对有左右语义的类乱用
bgr: 0.0
mosaic: 0.9               # 9 格 mosaic：小车在 1280 图里占比小
mixup: 0.5
copy_paste: 0.5           # 把实例贴到别的图，补遮挡样本（他们更推崇天然遮挡标注）

# ----- 训练过程 -----
patience: 100             # 100 epoch 无提升就停；总轮数 500 很长
batch: -1                 # AutoBatch，按显存自动撑满（3060 训 1280 很必要）
save: true
save_period: 20
cache: false              # 1280 图缓存极吃内存，默认关
workers: 4
exist_ok: false
optimizer: auto
verbose: true
seed: 0
deterministic: true
single_cls: true          # 数据集只有 robot，关掉多类头的额外开销
rect: false
cos_lr: false
close_mosaic: 10          # 最后 10 epoch 关 mosaic，框变干净，利于收敛
amp: true
fraction: 1.0
val: true
iou: 0.7
max_det: 50               # 场上机器人 ≤ 10，50 足够
plots: true
