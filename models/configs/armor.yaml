# 装甲板检测超参。对照港科大 config/armor_training_config.yaml。
# 和上游的差别：骨干 YOLO26n。imgsz=192 在 stages.py，因为输入是车辆裁剪图。

# ----- 优化器（和车辆同一套，港科大没改） -----
lr0: 0.01
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1

# ----- 损失：3 类（dead/red/blue），cls / dfl 比车辆更均衡 -----
box: 7.5
cls: 1.0
dfl: 1.5                  # 装甲板框小，边界回归更依赖 DFL
label_smoothing: 0.005
nbs: 64

# ----- 增强：比车辆弱。ROI 已经很小，再猛 hsv 会把红蓝灯条冲掉 -----
hsv_h: 0.05
hsv_s: 0.1
hsv_v: 0.1
degrees: 0.0
translate: 0.1
scale: 0.9                # 原注释想改成 (0.1, 1)；官方接口只能给 gain
shear: 0.0
perspective: 0.0001
flipud: 0.1
fliplr: 0.2               # 红蓝是颜色不是左右，左右翻安全
bgr: 0.0
mosaic: 0.9
mixup: 0.5
copy_paste: 0.5

# ----- 训练过程 -----
patience: 100
batch: -1
save: true
save_period: 20
cache: false
workers: 4
exist_ok: false
optimizer: auto
verbose: true
seed: 0
deterministic: true
single_cls: false         # 必须分 dead / red / blue，不能并成一类
rect: false
cos_lr: false
close_mosaic: 10
amp: true
fraction: 1.0
val: true
iou: 0.7
max_det: 50
plots: true
