[project]
name = "deus-radar-models"
version = "0.1.0"
description = "YOLO26 detect + MobileNetV3-Small pattern training for HKUST RM2025 radar"
requires-python = ">=3.10"
dependencies = [
  "ultralytics>=8.4.0",
  "typer>=0.15.0",
  "pydantic>=2.10.0",
  "pyyaml>=6.0.2",
  "torch>=2.4.0",
  "torchvision>=0.19.0",
  "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]

[tool.pytest.ini_options]
pythonpath = [".."]
