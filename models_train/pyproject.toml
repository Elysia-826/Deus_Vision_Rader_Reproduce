[project]
name = "deus-radar-models"
version = "0.1.0"
description = "YOLO26 training for HKUST RM2025 radar detect stages"
requires-python = ">=3.10"
dependencies = [
  "ultralytics>=8.4.0",
  "typer>=0.15.0",
  "pydantic>=2.10.0",
  "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]

[tool.pytest.ini_options]
pythonpath = [".."]
testpaths = ["tests"]
